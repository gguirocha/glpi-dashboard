# /etc/nginx/conf.d/glpi-dashboard.conf — versão com a API de projetos (PRJ-2026-092 / E2)
# Mudanças em relação à config de 27/11/2026 (lida na EC2):
#  - zona de limite por IP para /api/projetos (30 req/min, rajada 20) + 429;
#  - location /api/projetos: corpo máx. 32k, X-Real-IP = IP real do cliente (o app só confia nesse header),
#    X-Forwarded-For sobrescrito (não preserva valor forjado), sem cache;
#  - X-Real-IP também no location / (inofensivo, deixa o IP disponível para o app).
# Aplicar: copiar para a EC2, `sudo nginx -t` e só então `sudo systemctl reload nginx` (backup do arquivo antes).

limit_req_zone $binary_remote_addr zone=dash_api_projetos:10m rate=30r/m;

server {
    server_name dash.mundodosferros.com.br;

    location /api/projetos {
        limit_req zone=dash_api_projetos burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dash.mundodosferros.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dash.mundodosferros.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = dash.mundodosferros.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name dash.mundodosferros.com.br;
    return 404; # managed by Certbot


}
